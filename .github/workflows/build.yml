name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --stacktrace --no-daemon > gradle_output.log 2>&1
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            echo "::group::Full gradle output"
            cat gradle_output.log
            echo "::endgroup::"
            grep -iE "error|exception|FAILED|what went wrong|caused by" gradle_output.log | head -30 | while IFS= read -r line; do
              safe=$(echo "$line" | sed 's/%/percent/g')
              echo "::error::${safe:0:400}"
            done
            exit $STATUS
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntiTheft-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit APK into repo (for direct download)
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/AntiTheft-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/AntiTheft-debug.apk
          git commit -m "Update built APK [skip ci]" || echo "No changes to commit"
          git push
